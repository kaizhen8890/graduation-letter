<!--
  ============================================================
  毕业祝福页 · 轻量版 index.html
  ============================================================
  这是一封“扫描 NFC 芯片后打开”的毕业祝福网页。
  打开后先看到封面，点击「开启信件」才开始播放音乐（绕过浏览器自动播放限制），
  随后进入信件：逐段打字机显示、底部同步双语歌词，最后停在手写信纸照片上。

  【想换成自己的内容，只需要改下面 5 个地方】
  1. 音频：在 <script> 里搜索 ASSETS.bgm / ASSETS.bgmFallback，
     换成你自己的音频地址，例如 'assets/my-song.m4a'；
     本文件默认引用 assets/ 文件夹里的音频；直接替换 assets/ 中的同名文件即可。
  2. 信纸照片：搜索 ASSETS.letter，换成你自己的图片地址（建议 4:5 竖图）。
  3. 信件正文：搜索 LETTER_PARAGRAPHS，按 { at: 秒数, text: '文字' } 修改。
     at 是“音乐播放到第几秒时出现这一段”，可按需调整。
  4. 歌词：搜索 id="lrc-source"，整段替换成你的 LRC 文件内容即可（支持双语）。
  5. 落款、日期、祝福语：搜索 TEXT 和 CONFIG，改成你自己的。
  想换配色可以改最上面的 :root CSS 变量（主色 #8DC11F）。
  ============================================================
-->

/* ==========================================================
   0. 全局变量 / 基础 reset
   ========================================================== */
:root {
  /* —— 主色：草绿 / 白 / 一点粉，想改主题色就改这里 —— */

  --c-green-hi: #c9f26a;
  --c-green-soft: #a9d94e;
  --c-green-deep: #456c12;
  --c-cream: #fbf7e8;
  --c-cream-deep: #efe7cc;
  --c-pink: #ff9fbd;
  --c-pink-soft: #ffd3e0;
  --c-red: #d9534f;
  --c-seal: #d64a49;
  --c-gold: #dccb92;
  --c-gold-dim: rgba(220, 203, 146, 0.45);
  --c-ink: #263a16;
  --c-ink-soft: #50643a;

  /* —— 背景 / 暗部 —— */
  --c-bg0: #070d04;
  --c-bg1: #101b09;
  --c-bg2: #1a2b10;

  /* —— 字体：优先圆润的日系字体，再回落到系统中文字体 —— */

    "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-jp: "LetterRound", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN",
    "Yu Gothic", "YuGothic", "Meiryo", "PingFang SC", sans-serif;
  --font-mincho: "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", "SimSun", serif;

  /* —— 安全区 —— */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  /* —— 底部歌词区：总高度控制在屏幕高度 15% 以内 —— */
  --lyrics-inner: clamp(74px, 10.7vh, 90px);
  --lyrics-h: calc(var(--lyrics-inner) + var(--safe-b));

  --ease-out: cubic-bezier(0.22, 0.9, 0.28, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}

@supports (height: 100dvh) {
  :root {
    --lyrics-inner: clamp(74px, 10.7dvh, 90px);
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--c-bg0);
  color: var(--c-cream);
  font-family: var(--font-round);
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--c-green-hi);
  outline-offset: 4px;
}

img {
  -webkit-user-drag: none;
}

p {
  margin: 0;
}

.svg-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

/* ==========================================================
   1. 背景：夜色、草绿光晕、和纸颗粒与花瓣
   ========================================================== */
.app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: var(--c-bg0);
}

.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background:
    radial-gradient(130% 90% at 50% -12%, #33531c 0%, #1a2d10 38%, #0c1607 70%, #060b03 100%);
}

.bg-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(220, 203, 146, 0.11) 1px, transparent 1.4px);
  background-size: 34px 34px;
  opacity: 0.5;
  -webkit-mask-image: radial-gradient(120% 85% at 50% 38%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
  mask-image: radial-gradient(120% 85% at 50% 38%, #000 0%, rgba(0, 0, 0, 0.35) 55%, transparent 78%);
}

.grain {
  position: absolute;
  inset: -10%;
  opacity: 0.055;
  mix-blend-mode: overlay;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  background-size: 170px 170px;
}

.aurora {
  position: absolute;
  border-radius: 50%;
  filter: blur(54px);
  mix-blend-mode: screen;
  opacity: 0.42;
  will-change: transform;
}

.aurora.a {
  width: 64vw;
  height: 64vw;
  left: -22vw;
  top: -16vh;
  background: radial-gradient(circle, rgba(141, 193, 31, 0.85) 0%, rgba(141, 193, 31, 0.16) 56%, transparent 72%);
  animation: auroraDrift 18s ease-in-out infinite alternate;
}

.aurora.b {
  width: 54vw;
  height: 54vw;
  right: -20vw;
  top: 14vh;
  background: radial-gradient(circle, rgba(255, 159, 189, 0.6) 0%, rgba(255, 159, 189, 0.1) 55%, transparent 72%);
  opacity: 0.2;
  animation: auroraDrift 23s ease-in-out -7s infinite alternate-reverse;
}

.aurora.c {
  width: 82vw;
  height: 48vw;
  left: 8vw;
  bottom: -26vh;
  background: radial-gradient(circle, rgba(74, 118, 22, 0.8) 0%, rgba(74, 118, 22, 0.14) 58%, transparent 74%);
  opacity: 0.35;
  animation: auroraDrift 26s ease-in-out -11s infinite alternate;
}

.mood {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(120% 88% at 50% 38%, transparent 32%, rgba(3, 6, 2, 0.42) 72%, rgba(2, 4, 1, 0.72) 100%);
  transition: opacity 2.2s ease;
}

body[data-view="photo"] .mood,
body[data-view="end"] .mood {
  opacity: 1;
}

/* 花瓣 / 音符的容器 */
.sky {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.petal {
  position: absolute;
  top: -8vh;
  left: var(--x, 50%);
  width: var(--s, 10px);
  height: calc(var(--s, 10px) * 0.76);
  border-radius: 78% 12% 78% 12%;
  background: linear-gradient(135deg, var(--c1, #ffd7e3), var(--c2, #ff9fbd));
  opacity: 0;
  filter: blur(0.2px);
  will-change: transform, opacity;
  animation: petalFall var(--dur, 14s) linear var(--delay, 0s) infinite;
}

.note {
  position: absolute;
  left: var(--x, 50%);
  bottom: -6vh;
  font-family: var(--font-jp);
  font-size: var(--fs, 13px);
  line-height: 1;
  color: rgba(201, 242, 106, 0.55);
  opacity: 0;
  text-shadow: 0 0 12px rgba(141, 193, 31, 0.7);
  will-change: transform, opacity;
  animation: noteUp var(--dur, 16s) linear var(--delay, 0s) infinite;
}

/* ==========================================================
   2. 复古卡片边框 + 角落花纹
   ========================================================== */
.frame {
  position: absolute;
  z-index: 4;
  inset: calc(9px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
  border: 1px solid rgba(220, 203, 146, 0.38);
  border-radius: 16px;
  pointer-events: none;
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.28),
    0 0 24px rgba(0, 0, 0, 0.25);
}

.frame::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(220, 203, 146, 0.17);
  border-radius: 12px;
}

.frame::after {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 9px;
  background-image:
    repeating-linear-gradient(45deg, rgba(220, 203, 146, 0.05) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(220, 203, 146, 0.04) 0 1px, transparent 1px 7px);
  opacity: 0.55;
}

.corner {
  position: absolute;
  width: clamp(42px, 11vw, 60px);
  height: clamp(42px, 11vw, 60px);
  color: rgba(220, 203, 146, 0.6);
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
}

.corner svg {
  display: block;
  width: 100%;
  height: 100%;
}

.corner.tl {
  top: -1px;
  left: -1px;
}

.corner.tr {
  top: -1px;
  right: -1px;
  transform: rotate(90deg);
}

.corner.br {
  right: -1px;
  bottom: -1px;
  transform: rotate(180deg);
}

.corner.bl {
  left: -1px;
  bottom: -1px;
  transform: rotate(270deg);
}

.frame-charm {
  position: absolute;
  top: -8px;
  left: 50%;
  width: 74px;
  height: 18px;
  transform: translateX(-50%);
  color: rgba(220, 203, 146, 0.55);
}

.frame-vertical {
  position: absolute;
  top: 50%;
  right: 13px;
  transform: translateY(-50%);
  writing-mode: vertical-rl;
  font-family: var(--font-mincho);
  font-size: 8px;
  letter-spacing: 0.4em;
  color: rgba(220, 203, 146, 0.32);
}

/* ==========================================================
   3. 顶部：祝字印章 / 标题 / 静音按钮
   ========================================================== */
.topbar {
  position: absolute;
  z-index: 30;
  top: 0;
  left: 0;
  right: 0;
  padding: calc(12px + var(--safe-t)) clamp(16px, 5vw, 26px) 0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  pointer-events: none;
}

.topbar > * {
  pointer-events: auto;
}

.seal {
  width: clamp(48px, 13.5vw, 62px);
  aspect-ratio: 1;
  transform: rotate(-3deg);
  filter:
    drop-shadow(0 7px 15px rgba(0, 0, 0, 0.55))
    drop-shadow(0 0 18px rgba(217, 83, 79, 0.22));
  animation: sealStamp 1.5s cubic-bezier(0.2, 1.25, 0.35, 1) both;
}

.seal svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.seal-ring-text {
  fill: rgba(255, 240, 230, 0.78);
  font-family: var(--font-jp);
  font-size: 6.6px;
  letter-spacing: 0.55px;
}

.seal-char {
  fill: #fff8f0;
  font-family: var(--font-round);
  font-size: 43px;
  font-weight: 800;
  filter: drop-shadow(0 1px 1px rgba(74, 0, 0, 0.45));
}

.topbar-center {
  position: absolute;
  top: calc(14px + var(--safe-t));
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: max-content;
  max-width: 55vw;
}

.topbar-kicker {
  font-size: 8px;
  letter-spacing: 0.32em;
  color: rgba(220, 203, 146, 0.8);
  white-space: nowrap;
}

.topbar-title {
  margin-top: 4px;
  font-family: var(--font-jp);
  font-size: clamp(11px, 3.2vw, 13px);
  letter-spacing: 0.24em;
  color: #eaf6d8;
  text-shadow: 0 0 12px rgba(141, 193, 31, 0.42);
  white-space: nowrap;
}

.sound-btn {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(220, 203, 146, 0.36);
  background: rgba(12, 21, 7, 0.5);
  color: #eaf6d8;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity 0.6s ease 0.8s, transform 0.6s ease 0.8s, visibility 0.6s, color 0.3s, border-color 0.3s;
}

.sound-btn svg {
  width: 18px;
  height: 18px;
  overflow: visible;
}

.sound-btn .spk {
  fill: currentColor;
}

.sound-btn .wave,
.sound-btn .slash {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.sound-btn .slash {
  opacity: 0;
  transition: opacity 0.25s;
}

body[data-view="letter"] .sound-btn,
body[data-view="photo"] .sound-btn {
  opacity: 1;
  visibility: visible;
  transform: none;
}

body.is-muted .sound-btn .wave {
  opacity: 0;
}

body.is-muted .sound-btn .slash {
  opacity: 1;
}

body.is-muted .sound-btn {
  color: rgba(238, 246, 224, 0.38);
  border-color: rgba(220, 203, 146, 0.18);
}

body[data-view="end"] .sound-btn {
  opacity: 0;
  visibility: hidden;
}

/* ==========================================================
   4. 封面
   ========================================================== */
.cover {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(80px + var(--safe-t)) clamp(18px, 5vw, 30px) calc(14px + var(--safe-b));
  transition: opacity 0.95s ease, visibility 0.95s;
}

body[data-view="letter"] .cover,
body[data-view="photo"] .cover,
body[data-view="end"] .cover {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.cover-inner {
  position: relative;
  width: min(100%, 410px);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.cover-halo {
  position: absolute;
  top: -6%;
  left: 50%;
  width: min(118vw, 470px);
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(141, 193, 31, 0.17) 0%, rgba(141, 193, 31, 0.06) 38%, transparent 66%);
  filter: blur(10px);
  pointer-events: none;
  z-index: -1;
}

.cover-ring {
  position: absolute;
  top: -2%;
  left: 50%;
  width: min(128vw, 500px);
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 1px dashed rgba(220, 203, 146, 0.14);
  pointer-events: none;
  z-index: -1;
  animation: spin 90s linear infinite;
}

.cover-ring::before,
.cover-ring::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 159, 189, 0.75);
  box-shadow: 0 0 10px rgba(255, 159, 189, 0.8);
}

.cover-ring::before {
  top: 12%;
  left: 17%;
}

.cover-ring::after {
  bottom: 8%;
  right: 22%;
  background: rgba(201, 242, 106, 0.8);
  box-shadow: 0 0 10px rgba(141, 193, 31, 0.85);
}

.cover-kicker {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-jp);
  font-size: 8.5px;
  letter-spacing: 0.32em;
  color: rgba(220, 203, 146, 0.82);
  white-space: nowrap;
  animation: riseIn 1.1s var(--ease-out) 0.1s both;
}

.cover-kicker .line {
  display: block;
  width: 26px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220, 203, 146, 0.55));
}

.cover-kicker .line:last-child {
  background: linear-gradient(90deg, rgba(220, 203, 146, 0.55), transparent);
}

.cover-title {
  position: relative;
  margin: 10px 0 0;
  padding: 0 4px;
  font-size: clamp(46px, 14.2vw, 68px);
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: 0.06em;
  color: var(--c-cream);
  text-shadow:
    0 0 18px rgba(141, 193, 31, 0.32),
    0 8px 34px rgba(0, 0, 0, 0.5);
  animation: titleIn 1.3s var(--ease-out) 0.18s both;
}

.cover-title .hl {
  color: var(--c-green-hi);
  text-shadow:
    0 0 12px rgba(201, 242, 106, 0.55),
    0 0 38px rgba(141, 193, 31, 0.42),
    0 0 80px rgba(141, 193, 31, 0.18);
}

.cover-title .spark {
  display: inline-block;
  margin-left: 4px;
  font-size: 0.28em;
  vertical-align: 0.85em;
  color: var(--c-pink);
  text-shadow: 0 0 10px rgba(255, 159, 189, 0.8);
  animation: sparkle 3.2s ease-in-out infinite;
}

.cover-jp {
  margin-top: 9px;
  font-family: var(--font-jp);
  font-size: clamp(11px, 3.2vw, 14px);
  letter-spacing: 0.42em;
  color: rgba(255, 211, 224, 0.92);
  text-shadow: 0 0 16px rgba(255, 159, 189, 0.35);
  animation: riseIn 1.1s var(--ease-out) 0.35s both;
}

.cover-song {
  margin-top: 10px;
  font-family: var(--font-jp);
  font-size: 9px;
  letter-spacing: 0.26em;
  color: rgba(220, 203, 146, 0.68);
  animation: riseIn 1.1s var(--ease-out) 0.45s both;
}

.cover-song span {
  color: rgba(220, 203, 146, 0.35);
}

.cover-tagline {
  margin-top: clamp(12px, 2.4vh, 18px);
  font-size: clamp(12px, 3.35vw, 14px);
  line-height: 1.8;
  letter-spacing: 0.1em;
  color: rgba(238, 246, 224, 0.76);
  animation: riseIn 1.1s var(--ease-out) 0.55s both;
}

/* —— 信封 —— */
.envelope-wrap {
  position: relative;
  width: min(72vw, 286px);
  aspect-ratio: 320 / 212;
  margin: clamp(22px, 4.4vh, 34px) 0 2px;
  z-index: 1;
  animation: riseIn 1.2s var(--ease-out) 0.6s both;
}

.envelope-wrap::before {
  content: "";
  position: absolute;
  inset: -38% -24%;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(141, 193, 31, 0.22) 0%, rgba(141, 193, 31, 0.05) 45%, transparent 70%);
  filter: blur(16px);
  pointer-events: none;
  z-index: -1;
}

.envelope {
  position: absolute;
  inset: 0;
  cursor: pointer;
  filter: drop-shadow(0 24px 28px rgba(0, 0, 0, 0.48));
  transition: transform 0.4s var(--ease-out);
}

.envelope:active {
  transform: scale(0.985);
}

.envelope svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.env-flap {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  transition: transform 0.9s cubic-bezier(0.6, -0.08, 0.3, 1), opacity 0.5s ease 0.3s;
}

.env-note {
  transform-box: fill-box;
  transition: transform 0.85s cubic-bezier(0.2, 0.9, 0.2, 1) 0.12s;
}

.env-seal {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.5s cubic-bezier(0.5, -0.4, 0.4, 1.35), opacity 0.35s ease;
}

.cover.is-opening .envelope {
  transform: translateY(-4px) scale(1.015);
}

.cover.is-opening .env-flap {
  transform: scaleY(0.06) translateY(-1px);
  opacity: 0.25;
}

.cover.is-opening .env-note {
  transform: translateY(-48px);
}

.cover.is-opening .env-seal {
  transform: scale(0.25) rotate(42deg);
  opacity: 0;
}

.env-line-to {
  font-family: var(--font-round);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.env-line-from {
  font-family: var(--font-round);
  font-size: 8.5px;
  letter-spacing: 0.08em;
}

/* —— 开启按钮 —— */
.open-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(72vw, 244px);
  height: 55px;
  margin-top: clamp(20px, 3.6vh, 28px);
  border-radius: 999px;
  color: #16230c;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.2em;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 42%),
    linear-gradient(135deg, #d8f78c 0%, var(--c-green) 52%, #6fa512 100%);
  box-shadow:
    0 14px 34px rgba(141, 193, 31, 0.28),
    0 2px 0 rgba(255, 255, 255, 0.25) inset,
    0 0 0 1px rgba(255, 255, 255, 0.12);
  transition: transform 0.22s var(--ease-out), box-shadow 0.3s ease, filter 0.3s ease;
  animation: riseIn 1.1s var(--ease-out) 0.7s both;
  overflow: visible;
}

.open-btn::before {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: inherit;
  border: 1px solid rgba(201, 242, 106, 0.42);
  animation: btnPulse 2.9s ease-out infinite;
  pointer-events: none;
}

.open-btn::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.55) 44%, transparent 64%);
  background-size: 240% 100%;
  background-position: 130% 0;
  animation: buttonSheen 4.6s ease-in-out 1.2s infinite;
  pointer-events: none;
}

.open-btn:active {
  transform: scale(0.965);
  filter: brightness(0.98);
}

.open-btn.is-loading {
  pointer-events: none;
}

.open-btn.is-loading .btn-icon {
  animation: spin 1.1s linear infinite;
}

.btn-icon {
  width: 19px;
  height: 19px;
  overflow: visible;
  flex: 0 0 auto;
}

.btn-icon path {
  fill: currentColor;
}

.btn-label {
  position: relative;
  z-index: 1;
}

.cover-hint {
  margin-top: 13px;
  font-size: 10px;
  letter-spacing: 0.17em;
  color: rgba(238, 246, 224, 0.48);
  animation: riseIn 1.1s var(--ease-out) 0.85s both;
}

.cover-credit {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: clamp(18px, 3.2vh, 28px);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(220, 203, 146, 0.55);
  animation: riseIn 1.1s var(--ease-out) 0.95s both;
}

.disc {
  position: relative;
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #3a541f, #101b09 65%);
  box-shadow:
    0 0 0 1px rgba(220, 203, 146, 0.35),
    0 5px 12px rgba(0, 0, 0, 0.4);
  animation: spin 28s linear infinite;
}

.disc img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.disc::after {
  content: "";
  position: absolute;
  inset: 41%;
  border-radius: 50%;
  background: #0b1306;
  box-shadow: 0 0 0 2px rgba(220, 203, 146, 0.3);
}

.cover-credit span {
  max-width: 210px;
  line-height: 1.6;
  text-align: left;
}

/* ==========================================================
   5. 转场闪光 / toast
   ========================================================== */
.flash {
  position: absolute;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at 50% 56%, rgba(240, 255, 206, 0.98) 0%, rgba(141, 193, 31, 0.55) 26%, rgba(10, 18, 6, 0) 64%);
  mix-blend-mode: screen;
}

.is-flashing .flash {
  animation: flashOpen 1s ease-out both;
}

.toast {
  position: absolute;
  z-index: 80;
  left: 50%;
  bottom: calc(var(--lyrics-h) + 18px);
  max-width: 86vw;
  padding: 9px 17px;
  border-radius: 999px;
  border: 1px solid rgba(220, 203, 146, 0.3);
  background: rgba(18, 29, 10, 0.92);
  color: #eaf6d8;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 8px);
  transition: opacity 0.35s ease, transform 0.35s var(--ease-out), visibility 0.35s;
}

.toast.is-show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

/* 下面的样式（信件、照片、歌词、动画）接在第 6 节 */
/* ==========================================================
   6. 信件主舞台
   ========================================================== */
.letter-stage {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(78px + var(--safe-t)) clamp(16px, 5vw, 30px) calc(var(--lyrics-h) + 14px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.9s ease, visibility 0.9s;
}

body[data-view="letter"] .letter-stage,
body[data-view="photo"] .letter-stage,
body[data-view="end"] .letter-stage {
  opacity: 1;
  visibility: visible;
}

body[data-view="end"] .letter-stage {
  padding-bottom: calc(20px + var(--safe-b));
}

body[data-view="end"] .photo-show {
  padding-bottom: calc(20px + var(--safe-b));
}

/* —— 信纸卡片 —— */
.letter-card {
  position: relative;
  width: min(100%, 490px);
  height: min(100%, 560px);
  display: flex;
  flex-direction: column;
  padding: 15px 15px 13px;
  border-radius: 9px;
  background:
    linear-gradient(180deg, rgba(255, 253, 246, 0.99) 0%, rgba(247, 241, 223, 0.99) 100%);
  box-shadow:
    0 28px 62px rgba(0, 0, 0, 0.52),
    0 0 0 1px rgba(220, 203, 146, 0.4),
    inset 0 0 0 1px rgba(255, 255, 255, 0.65);
  transform: translateY(18px) scale(0.97) rotate(-0.35deg);
  opacity: 0;
  transition:
    opacity 1s ease 0.1s,
    transform 1.35s var(--ease-out) 0.1s,
    filter 1.3s ease;
  will-change: transform, opacity;
}

body[data-view="letter"] .letter-card {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(-0.35deg);
}

body[data-view="photo"] .letter-card,
body[data-view="end"] .letter-card {
  opacity: 0;
  transform: translateY(-18px) scale(0.955) rotate(0deg);
  filter: blur(5px);
  pointer-events: none;
}

.letter-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(141, 193, 31, 0.075) 1px, transparent 1px),
    linear-gradient(90deg, rgba(141, 193, 31, 0.058) 1px, transparent 1px);
  background-size: 25px 25px;
  opacity: 0.9;
}

.letter-card::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(141, 193, 31, 0.16);
  border-radius: 6px;
  pointer-events: none;
}

.letter-card.is-complete {
  box-shadow:
    0 28px 62px rgba(0, 0, 0, 0.52),
    0 0 0 1px rgba(220, 203, 146, 0.45),
    0 0 46px rgba(141, 193, 31, 0.16),
    inset 0 0 0 1px rgba(255, 255, 255, 0.65);
}

/* 和纸胶带 */
.tape {
  position: absolute;
  z-index: 3;
  width: clamp(54px, 16vw, 82px);
  height: 21px;
  border-radius: 1px;
  opacity: 0.92;
  background:
    linear-gradient(115deg, rgba(255, 255, 255, 0.7), rgba(226, 238, 203, 0.48));
  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  pointer-events: none;
}

.tape::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.32) 1px, transparent 1px);
  background-size: 5px 100%;
  opacity: 0.45;
}

.tape-left {
  left: -14px;
  top: -10px;
  transform: rotate(-27deg);
}

.tape-right {
  right: -13px;
  top: -8px;
  transform: rotate(23deg);
  background: linear-gradient(115deg, rgba(255, 209, 222, 0.72), rgba(255, 255, 255, 0.42));
}

.letter-head {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 9px 10px 12px;
  border-bottom: 1px dashed rgba(80, 100, 58, 0.3);
}

.letter-to {
  font-size: clamp(11px, 3.05vw, 13px);
  letter-spacing: 0.14em;
  color: var(--c-ink-soft);
}

.letter-date {
  font-family: var(--font-jp);
  font-size: 9px;
  letter-spacing: 0.13em;
  color: #93a077;
  white-space: nowrap;
}

.letter-scroll {
  position: relative;
  z-index: 2;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: 14px 8px 4px 12px;
  scroll-behavior: smooth;
}

/* 滚动条不在顶部时，让信纸顶端内容柔和淡出，避免半截字 */
.letter-scroll.is-scrolled {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 12px, #000 38px, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0, transparent 12px, #000 38px, #000 100%);
}

.letter-scroll::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

.letter-body {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2.3vh, 18px);
}

.letter-p {
  margin: 0;
  font-size: clamp(14.5px, 4.05vw, 17px);
  font-weight: 500;
  line-height: 1.95;
  letter-spacing: 0.015em;
  color: #2b3e1b;
  text-align: justify;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.95s ease, transform 0.95s var(--ease-out);
  text-shadow: 0 0 16px rgba(141, 193, 31, 0.1);
}

.letter-p.is-in {
  opacity: 1;
  transform: none;
}

.letter-p.is-dim {
  opacity: 0.62;
}

.letter-p.greeting {
  font-size: clamp(19px, 5.4vw, 23px);
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.05em;
  color: #203314;
  text-shadow: 0 0 18px rgba(141, 193, 31, 0.22);
}

.letter-p.final {
  font-size: clamp(22px, 6.2vw, 28px);
  font-weight: 800;
  line-height: 1.5;
  letter-spacing: 0.12em;
  text-align: center;
  color: #33551a;
  padding-top: 5px;
  text-shadow: 0 0 22px rgba(141, 193, 31, 0.45);
}

.letter-p.is-dim.greeting,
.letter-p.is-dim.final {
  opacity: 0.72;
}

.cursor {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1px;
  vertical-align: -0.14em;
  border-radius: 1px;
  background: #5f8f17;
  box-shadow: 0 0 9px rgba(141, 193, 31, 0.85);
  animation: blink 1.05s steps(1) infinite;
}

.letter-sign {
  margin-top: 17px;
  text-align: right;
  font-size: clamp(11.5px, 3.15vw, 13px);
  letter-spacing: 0.16em;
  color: #5b6b45;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 1.1s ease, transform 1.1s var(--ease-out);
}

.letter-sign.is-in {
  opacity: 0.92;
  transform: none;
}

/* ==========================================================
   7. 结尾：手写信纸照片
   ========================================================== */
.photo-show {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(84px + var(--safe-t)) clamp(16px, 5vw, 30px) calc(var(--lyrics-h) + 20px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition:
    opacity 1.6s ease 0.2s,
    visibility 1.6s,
    transform 1.7s var(--ease-out);
}

body[data-view="photo"] .photo-show,
body[data-view="end"] .photo-show {
  opacity: 1;
  visibility: visible;
  transform: none;
}

.photo-show::before {
  content: "";
  position: absolute;
  width: min(130vw, 560px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(141, 193, 31, 0.2) 0%, rgba(141, 193, 31, 0.05) 45%, transparent 66%);
  filter: blur(18px);
  pointer-events: none;
}

.photo-wrap {
  position: relative;
  z-index: 1;
  width: min(82vw, 380px, calc(56vh * 0.78));
  padding: 9px 9px 34px;
  border-radius: 4px;
  background: linear-gradient(160deg, #fdfbf0 0%, #eee7d0 100%);
  box-shadow:
    0 32px 72px rgba(0, 0, 0, 0.65),
    0 0 0 1px rgba(220, 203, 146, 0.35);
  transform: rotate(-1.6deg);
  cursor: zoom-in;
  transition: transform 0.5s var(--ease-out), box-shadow 0.5s ease;
  -webkit-tap-highlight-color: transparent;
}

@supports (height: 100dvh) {
  .photo-wrap {
    width: min(82vw, 380px, calc(56dvh * 0.78));
  }
}

.photo-wrap:active {
  transform: rotate(-1.2deg) scale(0.99);
  box-shadow:
    0 20px 46px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(220, 203, 146, 0.35);
}

.photo-wrap img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 2px;
  background: #1a1a1a;
  filter: saturate(0.96) contrast(1.02);
}

.photo-tape {
  position: absolute;
  top: -12px;
  left: 50%;
  width: 92px;
  height: 22px;
  transform: translateX(-50%) rotate(-1.5deg);
  background:
    linear-gradient(115deg, rgba(255, 209, 222, 0.78), rgba(255, 255, 255, 0.42));
  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.22);
  opacity: 0.95;
  pointer-events: none;
}

.photo-tape::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
  background-size: 5px 100%;
  opacity: 0.4;
}

.photo-num {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 10px;
  text-align: center;
  font-family: var(--font-jp);
  font-size: 8px;
  letter-spacing: 0.3em;
  color: #8d8568;
}

.photo-caption {
  position: relative;
  z-index: 1;
  margin-top: 15px;
  font-size: clamp(10px, 2.9vw, 12px);
  letter-spacing: 0.15em;
  color: rgba(238, 246, 224, 0.62);
  text-align: center;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
  transition: opacity 0.7s ease, height 0.7s ease, margin 0.7s ease;
}

.photo-hint {
  position: relative;
  z-index: 1;
  margin-top: 7px;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(220, 203, 146, 0.45);
  transition: opacity 0.6s ease;
}

/* 音乐结束后出现的落款 / 重播 */
.end-note {
  position: relative;
  z-index: 2;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition:
    opacity 1.1s ease 0.35s,
    transform 1.1s var(--ease-out) 0.35s,
    visibility 1.1s;
  pointer-events: none;
  text-align: center;
}

body[data-view="end"] .end-note {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
}

.mini-seal {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: #fff6ee;
  font-size: 18px;
  font-weight: 800;
  transform: rotate(-6deg);
  background:
    radial-gradient(circle at 34% 30%, #f0746b 0%, #d64a49 52%, #a72e31 100%);
  box-shadow:
    0 0 0 1px rgba(255, 235, 225, 0.28) inset,
    0 8px 18px rgba(0, 0, 0, 0.35);
  text-shadow: 0 1px 1px rgba(74, 0, 0, 0.35);
}

.end-kicker {
  font-family: var(--font-jp);
  font-size: 8px;
  letter-spacing: 0.34em;
  color: rgba(255, 159, 189, 0.78);
}

.end-note h2 {
  margin: 0;
  font-size: clamp(23px, 6.6vw, 31px);
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--c-cream);
  text-shadow:
    0 0 15px rgba(141, 193, 31, 0.55),
    0 0 42px rgba(141, 193, 31, 0.28);
}

.end-note p {
  font-size: clamp(10px, 2.9vw, 12px);
  letter-spacing: 0.13em;
  color: rgba(238, 246, 224, 0.7);
}

.replay-btn {
  margin-top: 5px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid rgba(220, 203, 146, 0.42);
  background: rgba(14, 24, 8, 0.55);
  color: #eaf6d8;
  font-size: 10.5px;
  letter-spacing: 0.17em;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
}

.replay-btn:active {
  transform: scale(0.96);
  background: rgba(141, 193, 31, 0.18);
  border-color: rgba(201, 242, 106, 0.55);
}

/* 音乐结束：收起歌词与提示，把舞台让给信纸 */
body[data-view="end"] .lyrics {
  opacity: 0;
  visibility: hidden;
  transform: translateY(22px);
}

body[data-view="end"] .photo-caption,
body[data-view="end"] .photo-hint {
  opacity: 0;
  visibility: hidden;
  height: 0;
  margin: 0;
}

body[data-view="end"] .photo-wrap {
  transform: rotate(-1.1deg) translateY(-2px);
}

/* ==========================================================
   8. 底部歌词区（固定在最下方，约 10~13% 屏高）
   ========================================================== */
.lyrics {
  position: absolute;
  z-index: 35;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--lyrics-h);
  padding: 0 clamp(14px, 4.5vw, 22px) var(--safe-b);
  display: flex;
  align-items: center;
  background: linear-gradient(180deg, rgba(8, 14, 5, 0.52) 0%, rgba(7, 12, 4, 0.86) 66%, rgba(4, 8, 2, 0.94) 100%);
  border-top: 1px solid rgba(220, 203, 146, 0.18);
  -webkit-backdrop-filter: blur(10px) saturate(1.08);
  backdrop-filter: blur(10px) saturate(1.08);
  opacity: 0;
  visibility: hidden;
  transform: translateY(16px);
  transition:
    opacity 0.8s ease 0.45s,
    transform 0.8s var(--ease-out) 0.45s,
    visibility 0.8s;
}

body[data-view="letter"] .lyrics,
body[data-view="photo"] .lyrics {
  opacity: 1;
  visibility: visible;
  transform: none;
}

.lyrics-progress {
  position: absolute;
  top: 0;
  left: 0;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, var(--c-green) 0%, var(--c-green-hi) 58%, var(--c-pink) 100%);
  box-shadow: 0 0 10px rgba(141, 193, 31, 0.55);
  transition: width 0.28s linear;
}

.lyrics-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  padding-top: 4px;
}

.lyrics-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 3px;
  font-family: var(--font-jp);
  font-size: 8px;
  letter-spacing: 0.16em;
  color: rgba(220, 203, 146, 0.55);
  white-space: nowrap;
}

.lyrics-song {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lyrics-time {
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.1em;
  color: rgba(220, 203, 146, 0.4);
}

.eq {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 9px;
}

.eq i {
  width: 2px;
  height: 100%;
  border-radius: 2px;
  background: var(--c-green-hi);
  transform-origin: bottom;
  animation: eq 0.95s ease-in-out infinite;
}

.eq i:nth-child(1) {
  height: 45%;
  animation-delay: -0.18s;
}

.eq i:nth-child(2) {
  height: 100%;
  animation-delay: -0.5s;
}

.eq i:nth-child(3) {
  height: 65%;
  animation-delay: -0.32s;
}

body.is-muted .eq i {
  animation-play-state: paused;
  opacity: 0.3;
}

.lyrics-core {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.lyrics-core.is-fading {
  opacity: 0;
  transform: translateY(5px);
}

.lyric-jp {
  width: 100%;
  font-family: var(--font-jp);
  font-size: clamp(11px, 3vw, 13.6px);
  line-height: 1.42;
  letter-spacing: 0.035em;
  color: #eef8d9;
  text-align: center;
  text-shadow: 0 0 12px rgba(141, 193, 31, 0.32);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  word-break: break-word;
}

.lyric-cn {
  width: 100%;
  font-size: clamp(10px, 2.75vw, 12px);
  line-height: 1.4;
  letter-spacing: 0.04em;
  color: rgba(255, 190, 208, 0.93);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ==========================================================
   9. 大图查看 / 无 JS 提示
   ========================================================== */
.lightbox {
  position: absolute;
  inset: 0;
  z-index: 90;
  overflow: hidden;
  background: rgba(3, 6, 2, 0.96);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s;
}

.lightbox.is-open {
  opacity: 1;
  visibility: visible;
}

.lightbox-scroll {
  position: absolute;
  inset: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
  touch-action: pan-x pan-y;
}

.lightbox-scroll::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

.lightbox img {
  display: block;
  height: calc(100% - 6px);
  width: auto;
  max-width: none;
  max-height: none;
  margin: 3px 0;
}

.lightbox::before,
.lightbox::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 92px;
  z-index: 1;
  pointer-events: none;
}

.lightbox::before {
  top: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent);
}

.lightbox::after {
  bottom: 0;
  background: linear-gradient(0deg, rgba(0, 0, 0, 0.65), transparent);
}

.lightbox-close {
  z-index: 2;
  position: absolute;
  top: calc(14px + var(--safe-t));
  right: calc(14px + var(--safe-r));
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid rgba(220, 203, 146, 0.35);
  background: rgba(14, 24, 8, 0.6);
  color: #eaf6d8;
  font-size: 18px;
  line-height: 1;
}

.lightbox-hint {
  z-index: 2;
  position: absolute;
  bottom: calc(16px + var(--safe-b));
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(220, 203, 146, 0.55);
}

.noscript {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #0b1407;
  color: #eaf6d8;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-align: center;
}

/* ==========================================================
   10. 动画关键帧
   ========================================================== */
@keyframes auroraDrift {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(3vw, 2vh, 0) scale(1.08);
  }
  100% {
    transform: translate3d(-2vw, 4vh, 0) scale(0.97);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

@keyframes petalFall {
  0% {
    opacity: 0;
    transform: translate3d(0, -8vh, 0) rotate(0deg);
  }
  9% {
    opacity: var(--o, 0.7);
  }
  82% {
    opacity: calc(var(--o, 0.7) * 0.62);
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--dx, 30px), 110vh, 0) rotate(var(--rot, 220deg));
  }
}

@keyframes noteUp {
  0% {
    opacity: 0;
    transform: translate3d(0, 0, 0) rotate(-8deg);
  }
  12% {
    opacity: 0.8;
  }
  80% {
    opacity: 0.35;
  }
  100% {
    opacity: 0;
    transform: translate3d(14px, -64vh, 0) rotate(14deg);
  }
}

@keyframes sealStamp {
  0% {
    opacity: 0;
    transform: scale(2.1) rotate(-16deg);
    filter: blur(5px);
  }
  55% {
    opacity: 1;
    transform: scale(0.94) rotate(-4deg);
    filter: blur(0);
  }
  72% {
    transform: scale(1.035) rotate(-3deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(-3deg);
  }
}

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(13px);
    filter: blur(3px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: blur(0);
  }
}

@keyframes titleIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.985);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: blur(0);
  }
}

@keyframes sparkle {
  0%,
  100% {
    opacity: 0.55;
    transform: scale(0.8) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.15) rotate(18deg);
  }
}

@keyframes btnPulse {
  0% {
    transform: scale(0.97);
    opacity: 0.72;
  }
  70% {
    transform: scale(1.09);
    opacity: 0;
  }
  100% {
    transform: scale(1.09);
    opacity: 0;
  }
}

@keyframes buttonSheen {
  0%,
  56% {
    background-position: 135% 0;
  }
  76%,
  100% {
    background-position: -40% 0;
  }
}

@keyframes flashOpen {
  0% {
    opacity: 0;
    transform: scale(0.2);
  }
  16% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: scale(1.7);
  }
}

@keyframes eq {
  0%,
  100% {
    transform: scaleY(0.3);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ==========================================================
   11. 屏幕适配
   ========================================================== */
@media (max-height: 720px) {
  .cover {
    padding-top: calc(70px + var(--safe-t));
  }

  .cover-title {
    font-size: clamp(42px, 12.8vw, 58px);
  }

  .cover-tagline {
    margin-top: 8px;
    line-height: 1.65;
  }

  .envelope-wrap {
    width: min(64vw, 252px);
    margin: 14px 0 0;
  }

  .open-btn {
    height: 49px;
    margin-top: 16px;
  }

  .cover-hint {
    margin-top: 9px;
  }

  .cover-credit {
    margin-top: 13px;
  }

  .letter-card {
    height: 100%;
  }

  .letter-p {
    line-height: 1.88;
  }

  .photo-caption {
    margin-top: 10px;
  }

  .end-note {
    gap: 5px;
    margin-top: 8px;
  }

  .mini-seal {
    width: 30px;
    height: 30px;
    font-size: 16px;
  }
}

@media (max-height: 600px) {
  .cover-song {
    display: none;
  }

  .cover-tagline {
    margin-top: 5px;
    font-size: 11px;
  }

  .envelope-wrap {
    width: min(58vw, 218px);
    margin-top: 10px;
  }

  .open-btn {
    height: 46px;
    margin-top: 12px;
    font-size: 15px;
  }

  .cover-hint {
    display: none;
  }

  .cover-credit {
    margin-top: 10px;
  }

  .photo-caption {
    display: none;
  }

  .photo-wrap {
    width: min(76vw, calc(48vh * 0.78));
  }

  .frame-vertical {
    display: none;
  }

  .topbar-center {
    top: calc(12px + var(--safe-t));
  }
}

@media (max-width: 370px) {
  .cover-title {
    letter-spacing: 0.02em;
  }

  .letter-card {
    padding: 12px 11px 10px;
  }

  .letter-scroll {
    padding-left: 9px;
    padding-right: 5px;
  }

  .lyrics-meta {
    font-size: 7.5px;
    letter-spacing: 0.1em;
  }

  .lyric-jp {
    font-size: 11px;
  }

  .lyric-cn {
    font-size: 9.5px;
  }
}

@media (orientation: landscape) and (max-height: 560px) {
  .frame-vertical,
  .frame-charm,
  .cover-credit,
  .cover-tagline {
    display: none;
  }

  .cover-title {
    font-size: 38px;
  }

  .cover-jp {
    margin-top: 3px;
  }

  .envelope-wrap {
    width: min(38vw, 200px);
    margin-top: 6px;
  }

  .open-btn {
    margin-top: 10px;
    height: 44px;
  }

  .photo-wrap {
    width: min(42vw, calc(72vh * 0.78));
  }

  .topbar-center {
    display: none;
  }
}

@media (hover: hover) and (pointer: fine) {
  .open-btn:hover {
    transform: translateY(-2px) scale(1.015);
    box-shadow:
      0 18px 42px rgba(141, 193, 31, 0.36),
      0 2px 0 rgba(255, 255, 255, 0.25) inset,
      0 0 0 1px rgba(255, 255, 255, 0.15);
  }

  .envelope:hover {
    transform: translateY(-3px);
  }

  .photo-wrap:hover {
    transform: rotate(-1.6deg) scale(1.012);
  }

  .replay-btn:hover {
    background: rgba(141, 193, 31, 0.16);
    border-color: rgba(201, 242, 106, 0.5);
  }

  .sound-btn:hover {
    border-color: rgba(201, 242, 106, 0.5);
  }
}

/* 尊重“减少动态效果”偏好 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.2s !important;
    scroll-behavior: auto !important;
  }

  .petal,
  .note {
    display: none;
  }

  .cover-ring,
  .disc,
  .aurora {
    animation: none !important;
  }
}

/* 预览模式（?state=photo 等）下隐藏一些交互控件，方便截图 */
body.is-preview .sound-btn {
  display: none;
}

  var replayBtn = $('replayBtn');
  var audio = $('bgm');

  function clamp(num, min, max) {
    return Math.min(max, Math.max(min, num));
  }

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return pad2(m) + ':' + pad2(s);
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  var toastTimer = null;
  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-show'); }, 4200);
  }

  /* ==========================================================
     2. 解析 LRC（底部歌词）
     - 直接把 id="lrc-source" 里的内容替换成你的 LRC 文件即可
     - 同一时间戳有多行时：第一行当原文，第二行当译文
     ========================================================== */
  var lrcRaw = $('lrc-source') ? $('lrc-source').textContent : '';
  var cues = parseLRC(lrcRaw);

  function parseLRC(raw) {
    var list = [];
    var map = {};
    if (!raw) return list;
    var lines = raw.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var m = line.match(/^\[(\d{1,3}):(\d{1,2}(?:\.\d{1,3})?)\]\s*(.*)$/);
      if (!m) continue;
      var time = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
      var text = m[3].trim();
      if (!text) continue;
      var key = time.toFixed(2);
      if (!map[key]) {
        map[key] = { t: time, lines: [] };
        list.push(map[key]);
      }
      map[key].lines.push(text);
    }
    list.sort(function (a, b) { return a.t - b.t; });
    var out = [];
    for (var j = 0; j < list.length; j++) {
      out.push({
        t: list[j].t,
        jp: list[j].lines[0] || '',
        cn: list[j].lines.length > 1 ? list[j].lines[1] : ''
      });
    }
    return out;
  }

  /* ==========================================================
     3. 状态
     ========================================================== */
  var started = false;
  var ended = false;
  var audioOK = false;
  var offsetLocked = false;
  var audioOffset = 0;
  var fallbackEpoch = 0;
  var tickTimer = null;

  var lyricIndex = -2;
  var lastJp = '';
  var lastCn = '';
  var lyricSwapTimer = null;
  var lastTimeText = '';

  var letterIndex = 0;
  var typing = null;
  var typingTimer = null;
  var allParagraphsDone = false;
  var signShown = false;
  var photoShown = false;
  var userScrolled = false;
  var lastFollow = 0;

  /* ==========================================================
     4. 填充文案 / 图片 / 音频
     ========================================================== */
  function applyText() {
    if (letterTo) letterTo.textContent = TEXT.to;
    if (letterDate) letterDate.textContent = TEXT.date;
    if (letterSign) letterSign.textContent = TEXT.sign;
    if (photoCaption) photoCaption.textContent = TEXT.photoCaption;
    if ($('envTo')) $('envTo').textContent = TEXT.envTo;
    if ($('envFrom')) $('envFrom').textContent = TEXT.envFrom;
    if ($('endLine')) $('endLine').textContent = TEXT.endLine;
    if (lyricJp) lyricJp.textContent = TEXT.introJp;
    if (lyricCn) lyricCn.textContent = TEXT.introCn;
  }

  function applyAssets() {
    if (ASSETS.letter) {
      if (letterImg) letterImg.src = ASSETS.letter;
      if (lightboxImg) lightboxImg.src = ASSETS.letter;
    }
    if (ASSETS.jacket && jacketImg) {
      jacketImg.src = ASSETS.jacket;
    } else if (jacketImg) {
      var disc = jacketImg.parentNode;
      if (disc) disc.style.display = 'none';
    }
    if (!isPreview && ASSETS.bgm) {
      audio.volume = 0.9;
      audio.src = ASSETS.bgm;
      audio.load();
    }
  }

  /* ==========================================================
     5. 背景花瓣 / 音符（纯装饰，可删）
     ========================================================== */
  function buildSky() {
    var sky = $('sky');
    if (!sky) return;
    var colors = [
      ['#ffd7e3', '#ff9fbd'],
      ['#ffe8ef', '#ffc3d4'],
      ['#d9f3a3', '#a9d94e'],
      ['#f4fbe0', '#c9f26a']
    ];
    var i;
    for (i = 0; i < 15; i++) {
      var petal = document.createElement('span');
      petal.className = 'petal';
      var size = 6 + Math.random() * 8;
      var c = colors[i % colors.length];
      petal.style.setProperty('--x', (Math.random() * 100).toFixed(1) + '%');
      petal.style.setProperty('--s', size.toFixed(1) + 'px');
      petal.style.setProperty('--c1', c[0]);
      petal.style.setProperty('--c2', c[1]);
      petal.style.setProperty('--dur', (11 + Math.random() * 12).toFixed(1) + 's');
      petal.style.setProperty('--delay', (-Math.random() * 18).toFixed(1) + 's');
      petal.style.setProperty('--o', (0.42 + Math.random() * 0.38).toFixed(2));
      petal.style.setProperty('--dx', ((Math.random() * 2 - 1) * 90).toFixed(0) + 'px');
      petal.style.setProperty('--rot', (120 + Math.random() * 360).toFixed(0) + 'deg');
      sky.appendChild(petal);
    }
    for (i = 0; i < 4; i++) {
      var note = document.createElement('span');
      note.className = 'note';
      note.textContent = i % 2 ? '♫' : '♪';
      note.style.setProperty('--x', (8 + Math.random() * 84).toFixed(1) + '%');
      note.style.setProperty('--fs', (11 + Math.random() * 8).toFixed(0) + 'px');
      note.style.setProperty('--dur', (14 + Math.random() * 10).toFixed(1) + 's');
      note.style.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');
      sky.appendChild(note);
    }
  }

  /* ==========================================================
     6. 音频
     ========================================================== */
  function fallbackTime() {
    if (!fallbackEpoch) return 0;
    return (performance.now() - fallbackEpoch) / 1000;
  }

  function songTime() {
    if (audioOK) return Math.max(0, audio.currentTime + audioOffset);
    return fallbackTime();
  }

  function bindAudio() {
    if (!audio) return;

    audio.addEventListener('playing', function () {
      audioOK = true;
      if (!offsetLocked && fallbackEpoch > 0) {
        var ft = fallbackTime();
        if (ft > audio.currentTime + 0.35) {
          audioOffset = ft - audio.currentTime;
        }
        offsetLocked = true;
      }
    });

    audio.addEventListener('ended', function () {
      if (started && !isPreview) finishExperience();
    });

    audio.addEventListener('error', function () {
      if (isPreview) return;
      if (!bindAudio.fallbackTried && ASSETS.bgmFallback) {
        bindAudio.fallbackTried = true;
        audioOK = false;
        offsetLocked = false;
        audio.src = ASSETS.bgmFallback;
        audio.load();
        if (started) {
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
        }
      } else {
        audioOK = false;
        showToast('音乐加载失败，将以静音模式继续');
      }
    });
  }

  function toggleSound() {
    if (isPreview || !started || !audio) return;
    audio.muted = !audio.muted;
    updateSoundUI();
    if (!audio.muted && audio.paused) {
      offsetLocked = false;
      var p = audio.play();
      if (p && p.catch) {
        p.catch(function () { showToast('请轻触页面重试播放'); });
      }
    }
  }

  function updateSoundUI() {
    var muted = !!(audio && audio.muted);
    document.body.classList.toggle('is-muted', muted);
    if (soundBtn) {
      soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
      soundBtn.setAttribute('aria-label', muted ? '取消静音' : '静音');
    }
  }

  /* ==========================================================
     7. 开始体验：点击「开启信件」
     ========================================================== */
  function triggerFlash() {
    app.classList.remove('is-flashing');
    void app.offsetWidth;
    app.classList.add('is-flashing');
    setTimeout(function () { app.classList.remove('is-flashing'); }, 1100);
  }

  function beginExperience() {
    if (started || isPreview) return;
    started = true;

    if (openBtn) openBtn.classList.add('is-loading');
    if (btnLabel) btnLabel.textContent = '正在展开…';

    // 关键：play() 必须直接发生在点击手势里，否则 iOS / 微信会拦截自动播放
    if (!isPreview && ASSETS.bgm) {
      try {
        var p = audio.play();
        if (p && p.catch) {
          p.catch(function () {
            audioOK = false;
            showToast('音乐播放失败，将以静音模式继续');
          });
        }
      } catch (e) {
        audioOK = false;
        showToast('音乐播放失败，将以静音模式继续');
      }
    }

    cover.classList.add('is-opening');
    triggerFlash();

    setTimeout(finishTransition, 820);
  }

  function finishTransition() {
    if (document.body.dataset.view !== 'cover') return;
    fallbackEpoch = performance.now();
    // 如果音频已经在播放，锁定同步偏移；之后拖动进度（测试用）不会被二次修正
    if (audioOK) offsetLocked = true;
    document.body.dataset.view = 'letter';
    if (openBtn) openBtn.classList.remove('is-loading');
    startTick();
  }

  function startTick() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(tick, 120);
    tick();
  }

  /* ==========================================================
     8. 主循环：信件、歌词、进度
     ========================================================== */
  function tick() {
    if (ended) return;
    var t = songTime();

    if (!photoShown) {
      // 如果页面切到后台、或手动拖动进度，歌词时间可能突然前进很多。
      // 这时把已经错过的段落直接补全，避免“歌都唱到后面了，信还在慢慢打字”。
      if (typing && t - typing.at > 6) finishTyping(true);

      while (!typing && letterIndex < LETTER_PARAGRAPHS.length &&
             t >= LETTER_PARAGRAPHS[letterIndex].at) {
        var due = LETTER_PARAGRAPHS[letterIndex];
        var late = t - due.at;
        renderParagraph(letterIndex, late > 2.5);
        letterIndex++;
        if (late <= 2.5) break;
      }

      if (!signShown && t >= CONFIG.signAt) showSign();
      if (t >= CONFIG.photoAt) revealPhoto();
    }

    updateLyrics(t, false);
    updateProgress(t);

    // 音频失败时的兜底：用内部时钟走到结尾
    if (!audioOK && t >= CONFIG.songDuration) finishExperience();
  }

  function updateProgress(t) {
    var dur = CONFIG.songDuration;
    if (audioOK && isFinite(audio.duration) && audio.duration > 0.5) dur = audio.duration;
    var ratio = clamp(t / dur, 0, 1);
    if (lyricsProgress) lyricsProgress.style.width = (ratio * 100).toFixed(2) + '%';
    var txt = fmtTime(t) + ' / ' + fmtTime(dur);
    if (lyricsTime && txt !== lastTimeText) {
      lyricsTime.textContent = txt;
      lastTimeText = txt;
    }
  }

  function cueIndexAt(t) {
    var lo = 0;
    var hi = cues.length - 1;
    var ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (cues[mid].t <= t) {
        ans = mid;
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return ans;
  }

  function updateLyrics(t, immediate) {
    if (!lyricsCore) return;
    var idx = -1;
    if (cues.length && t >= cues[0].t) idx = cueIndexAt(t);
    if (idx === lyricIndex && !immediate) return;
    lyricIndex = idx;
    var jp = idx < 0 ? TEXT.introJp : cues[idx].jp;
    var cn = idx < 0 ? TEXT.introCn : cues[idx].cn;
    setLyricText(jp, cn, immediate);
  }

  function setLyricText(jp, cn, immediate) {
    if (jp === lastJp && cn === lastCn) return;
    lastJp = jp;
    lastCn = cn;
    clearTimeout(lyricSwapTimer);

    if (immediate) {
      lyricJp.textContent = jp;
      lyricCn.textContent = cn;
      lyricsCore.classList.remove('is-fading');
      return;
    }

    lyricsCore.classList.add('is-fading');
    lyricSwapTimer = setTimeout(function () {
      lyricJp.textContent = jp;
      lyricCn.textContent = cn;
      lyricsCore.classList.remove('is-fading');
    }, 190);
  }

  /* ==========================================================
     9. 信件打字机
     ========================================================== */
  function renderParagraph(idx, instant) {
    var cfg = LETTER_PARAGRAPHS[idx];
    if (!cfg) return;

    var p = document.createElement('p');
    p.className = 'letter-p' + (cfg.cls ? ' ' + cfg.cls : '');
    var span = document.createElement('span');
    span.className = 'txt';
    p.appendChild(span);

    var cursor = null;
    if (!instant) {
      cursor = document.createElement('i');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      p.appendChild(cursor);
    } else {
      span.textContent = cfg.text;
    }

    // 已经出现过的段落变暗，突出当前正在读的这一段
    for (var i = 0; i < letterBody.children.length; i++) {
      letterBody.children[i].classList.add('is-dim');
    }

    letterBody.appendChild(p);
    requestAnimationFrame(function () { p.classList.add('is-in'); });

    if (instant) {
      userScrolled = false;
      followScroll(true);
      return;
    }

    typing = {
      p: p,
      span: span,
      cursor: cursor,
      text: cfg.text,
      pos: 0,
      at: cfg.at
    };
    typeStep();
  }

  function typeStep() {
    if (!typing) return;

    if (typing.pos >= typing.text.length) {
      finishTyping();
      return;
    }

    var ch = typing.text.charAt(typing.pos);
    typing.pos++;
    typing.span.textContent += ch;

    if (typing.pos === 1 || typing.pos % 4 === 0 || typing.pos >= typing.text.length) {
      followScroll(false);
    }

    var wait = CONFIG.typeSpeed;
    if ('，、；：'.indexOf(ch) >= 0) wait += CONFIG.commaPause;
    else if ('。！？'.indexOf(ch) >= 0) wait += CONFIG.periodPause;
    else if (ch === '—') wait += 70;

    typingTimer = setTimeout(typeStep, wait);
  }

  function finishTyping(instant) {
    if (!typing) return;
    clearTimeout(typingTimer);

    if (instant && typing.span) {
      typing.span.textContent = typing.text;
    }
    if (typing.cursor && typing.cursor.parentNode) {
      typing.cursor.parentNode.removeChild(typing.cursor);
    }

    typing = null;
    followScroll(true);

    if (letterIndex >= LETTER_PARAGRAPHS.length) {
      allParagraphsDone = true;
      letterCard.classList.add('is-complete');
    }
  }

  function finishAllParagraphs() {
    if (typing) finishTyping(true);
    while (letterIndex < LETTER_PARAGRAPHS.length) {
      renderParagraph(letterIndex, true);
      letterIndex++;
    }
    allParagraphsDone = true;
    if (letterCard) letterCard.classList.add('is-complete');
  }

  function followScroll(force) {
    if (!CONFIG.autoScroll || !letterScroll) return;
    if (!force && userScrolled) return;
    var nowMs = performance.now();
    if (!force && nowMs - lastFollow < 220) return;
    lastFollow = nowMs;
    if (force) userScrolled = false;
    letterScroll.scrollTop = letterScroll.scrollHeight;
  }

  function showSign() {
    if (signShown || !letterSign) return;
    signShown = true;
    letterSign.classList.add('is-in');
    followScroll(true);
  }

  /* ==========================================================
     10. 结尾：信纸照片 + 结束画面
     ========================================================== */
  function revealPhoto() {
    if (photoShown) return;
    photoShown = true;

    finishAllParagraphs();
    showSign();

    document.body.dataset.view = 'photo';
    if (photoShow) photoShow.setAttribute('aria-hidden', 'false');
  }

  function finishExperience() {
    if (ended) return;
    ended = true;
    if (tickTimer) clearInterval(tickTimer);

    if (!photoShown) revealPhoto();

    document.body.dataset.view = 'end';
    if (photoShow) photoShow.setAttribute('aria-hidden', 'false');
    updateProgress(CONFIG.songDuration);
    if (lyricsTime) lyricsTime.textContent = fmtTime(CONFIG.songDuration) + ' / ' + fmtTime(CONFIG.songDuration);
    lastTimeText = lyricsTime ? lyricsTime.textContent : '';
  }

  /* ==========================================================
     11. 大图查看
     ========================================================== */
  function openLightbox() {
    if (!photoShown || !lightbox) return;
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () {
      var scroller = $('lightboxScroll');
      if (scroller) scroller.scrollLeft = Math.max(0, (scroller.scrollWidth - scroller.clientWidth) / 2);
    });
  }

  function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  /* ==========================================================
     12. 预览模式（开发 / 截图用）
     ?state=cover | letter | photo | end   可配合 &t=秒数
     例如：index.html?state=photo&t=140
     ========================================================== */
  function initPreview() {
    if (!isPreview) return false;
    document.body.classList.add('is-preview');

    if (previewState === 'cover') {
      document.body.dataset.view = 'cover';
      return true;
    }
    if (previewState !== 'letter' && previewState !== 'photo' && previewState !== 'end') {
      document.body.dataset.view = 'cover';
      return true;
    }

    document.body.dataset.view = previewState;
    var t = parseFloat(params.get('t') || '0');
    if (!(t > 0)) {
      t = previewState === 'end' ? CONFIG.songDuration : (previewState === 'photo' ? CONFIG.photoAt + 5 : 70);
    }
    var showAll = (previewState === 'photo' || previewState === 'end');

    while (letterIndex < LETTER_PARAGRAPHS.length &&
           (showAll || LETTER_PARAGRAPHS[letterIndex].at <= t)) {
      renderParagraph(letterIndex, true);
      letterIndex++;
    }
    allParagraphsDone = showAll || letterIndex >= LETTER_PARAGRAPHS.length;
    if (showAll || t >= CONFIG.signAt) showSign();

    if (showAll) {
      revealPhoto();
      if (previewState === 'end') {
        finishExperience();
      }
    }

    updateLyrics(t, true);
    updateProgress(t);
    return true;
  }

  /* ==========================================================
     13. 绑定事件 / 初始化
     ========================================================== */
  function bindEvents() {
    if (openBtn) openBtn.addEventListener('click', beginExperience);
    if (envelopeWrap) envelopeWrap.addEventListener('click', beginExperience);
    if (envelope) {
      envelope.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          beginExperience();
        }
      });
    }

    if (soundBtn) soundBtn.addEventListener('click', toggleSound);

    if (letterScroll) {
      letterScroll.addEventListener('touchstart', function () { userScrolled = true; }, { passive: true });
      letterScroll.addEventListener('wheel', function () { userScrolled = true; }, { passive: true });
      letterScroll.addEventListener('scroll', function () {
        letterScroll.classList.toggle('is-scrolled', letterScroll.scrollTop > 6);
      }, { passive: true });
    }

    if (photoWrap) {
      photoWrap.addEventListener('click', openLightbox);
      photoWrap.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox();
        }
      });
    }
    if (lightbox) {
      var lbDown = null;
      lightbox.addEventListener('pointerdown', function (e) {
        lbDown = { x: e.clientX, y: e.clientY };
      }, { passive: true });
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightboxClose) return;
        if (lbDown && Math.abs(e.clientX - lbDown.x) + Math.abs(e.clientY - lbDown.y) > 24) return;
        closeLightbox();
      });
    }
    if (lightboxClose) {
      lightboxClose.addEventListener('click', function (e) {
        e.stopPropagation();
        closeLightbox();
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    if (replayBtn) {
      replayBtn.addEventListener('click', function () { window.location.reload(); });
    }

    bindAudio();
  }

  function init() {
    applyText();
    applyAssets();
    buildSky();
    updateSoundUI();
    bindEvents();
    initPreview();
  }

  // 调试接口：在控制台里可以 __letter.state() / __letter.seek(120) / __letter.finish()
  window.__letter = {
    open: beginExperience,
    finish: revealPhoto,
    seek: function (sec) {
      try { audio.currentTime = Number(sec) || 0; } catch (e) {}
    },
    state: function () {
      return {
        view: document.body.dataset.view,
        time: songTime(),
        letterIndex: letterIndex,
        typing: !!typing,
        photo: photoShown,
        ended: ended,
        audio: { readyState: audio.readyState, paused: audio.paused, muted: audio.muted, currentTime: audio.currentTime }
      };
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
